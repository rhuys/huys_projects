[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "huys_projects"
version = "0.1.0"

dependencies = [
    "pyhuys",
    "numpy",
    "Pillow",
    "rapidocr_onnxruntime",
    "pyperclip"
]

[project.scripts]
ocr = "ocr.ocr:main"
base64 = "ocr.base64:main"
image_viewer = "image_viewer.image_viewer:main"

[tool.setuptools]
packages = ["ocr", "image_viewer"]

