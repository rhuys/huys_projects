[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "huys_projects"
version = "0.1.0"

dependencies = [
    "pyhuys",
    "numpy",
    "Pillow",
    "rapidocr_onnxruntime",
    "pyperclip"
]

[project.scripts]
ocr = "ocr.ocr:main"
enc64 = "ocr.enc64:main"
dec64 = "ocr.dec64:main"
image_viewer = "image_viewer.image_viewer:main"
bitenc = "bit_encoder.bitenc:main"
bitdec = "bit_encoder.bitdec:main"

[tool.setuptools]
packages = ["ocr", "image_viewer", "bit_encoder"]

